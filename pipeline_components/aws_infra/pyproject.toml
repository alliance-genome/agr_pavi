[project]
name = "pipeline-aws_infra"
version = "0.1.0"
description = "PAVI pipeline AWS resource definitions"
readme = "README.md"
authors = [
    {name = "Manuel Luypaert", email = "luypaert@ebi.ac.uk"}
]

requires-python = "==3.12.*"
dependencies = [
    # CDK requirements
    "aws-cdk-lib==2.*",
    # PAVI shared AWS module
    "pavi_shared_aws @ file:///tmp/pavi_shared_aws-0.0.0-py3-none-any.whl"
]

[project.optional-dependencies]
test = [
    "flake8==7.3.*",
    "flake8-unused-arguments==0.0.*",
    "mypy==1.18.*",
    "pytest>=8.4,<9.2"
]

[tool.setuptools.packages.find]
# include = ["cdk_classes/*"]
exclude = ["node_modules/*"]

[tool.pytest.ini_options]
# local-testing/ holds manual e2e scripts that need a running stack and extra
# deps (requests); keep them out of the unit-test run.
testpaths = ["tests"]
